<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutoria - Suporte aos alunos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>📚 Tutoria</h1>
    <p>Quiz e cards para as disciplinas iniciais</p>
  </header>

  <main class="container">
    <section class="lista-disciplinas">

      <article class="card-disciplina" style="--destaque: #7c4dff;">
        <h2>Introdução à Estatística</h2>
        <p>12 cards · 8 perguntas</p>
        <div class="acoes">
          <a href="#" class="btn">Estudar</a>
          <a href="#" class="btn btn-secundario">Quiz</a>
        </div>
      </article>

      <article class="card-disciplina" style="--destaque: #ff6b6b;">
        <h2>Cálculo 1</h2>
        <p>10 cards · 6 perguntas</p>
        <div class="acoes">
          <a href="#" class="btn">Estudar</a>
          <a href="#" class="btn btn-secundario">Quiz</a>
        </div>
      </article>

      <article class="card-disciplina" style="--destaque: #00b894;">
        <h2>Álgebra Linear</h2>
        <p>8 cards · 5 perguntas</p>
        <div class="acoes">
          <a href="#" class="btn">Estudar</a>
          <a href="#" class="btn btn-secundario">Quiz</a>
        </div>
      </article>

    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
